# robot_localization EKF: 엔코더 odom + BNO085 IMU -> odom->base_link
# 2026-11-21 작성. 바닥 시험에서 엔코더 yaw가 실제(IMU)와 30 cm당 1~2° 달라
# 방향은 IMU, 거리·속도는 엔코더를 주로 쓰도록 구성한다.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 순서: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # Game Rotation Vector(자기계 미사용) yaw는 시작 시점 기준 상대값으로 쓴다.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_relative: true
    imu0_differential: false
    imu0_queue_size: 10
